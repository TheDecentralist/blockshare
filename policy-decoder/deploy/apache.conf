<VirtualHost *:80>
    ServerName policy-decoder.blockshare.ca
    ProxyPreserveHost On
    ProxyTimeout 180
    ProxyPass / http://127.0.0.1:3131/ timeout=180
    ProxyPassReverse / http://127.0.0.1:3131/
    ErrorLog ${APACHE_LOG_DIR}/policy-decoder-error.log
    CustomLog ${APACHE_LOG_DIR}/policy-decoder-access.log combined
</VirtualHost>
